# test → build → push to GHCR → deploy to Loft by digest, waiting for the health gate.
name: deploy
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 26
          cache: npm

      - run: npm ci --ignore-scripts
      - run: npm test

      - name: Read paas.yaml
        id: manifest
        run: |
          echo "app=$(sed -n 's/^name: *\([a-z0-9-]*\).*/\1/p' paas.yaml)" >> "$GITHUB_OUTPUT"
          echo "image=$(sed -n 's/^image: *\([^ #]*\).*/\1/p' paas.yaml)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.manifest.outputs.image }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy to Loft
        env:
          LOFT_DEPLOY_TOKEN: ${{ secrets.LOFT_DEPLOY_TOKEN }}
          APP: ${{ steps.manifest.outputs.app }}
          DIGEST: ${{ steps.build.outputs.digest }}
          MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          body=$(jq -n --arg d "$DIGEST" --arg c "${GITHUB_SHA::12}" --arg m "${MESSAGE:0:500}" \
            '{digest: $d, commit: $c, message: $m}')
          status=$(curl -sS --max-time 600 -o response.json -w '%{http_code}' \
            -X POST "https://paas.beslic.me/api/apps/$APP/deploy?wait=1" \
            -H "Authorization: Bearer $LOFT_DEPLOY_TOKEN" \
            -H "X-Loft-Timestamp: $(date +%s)" \
            -H "X-Loft-Nonce: gh-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            -H 'Content-Type: application/json' \
            -d "$body")
          jq . response.json || cat response.json
          echo "### Loft: $(jq -r '.status // .error' response.json) → $(jq -r '.url // ""' response.json)" >> "$GITHUB_STEP_SUMMARY"
          test "$status" = 200
